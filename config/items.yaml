# Items deployed into one of this framework's workspaces, per environment. `path`
# is the folder under src/ (this repo, downloaded fresh from git on every NB_DEPLOY
# run). `requires_silver: true` items are only deployed when that environment's
# `include_silver` flag (environments.yaml) is true. `workspace` picks which
# workspace the item deploys into -- `Code` or `Ingestion` -- and defaults to
# `Code` when omitted, so most entries don't need to mention it at all.

items:
  - name: VAR_KEYSTONE
    type: VariableLibrary
    path: VAR_KEYSTONE.VariableLibrary

  - name: NB_KEYSTONE_FUNCTIONS
    type: Notebook
    path: NB_KEYSTONE_FUNCTIONS.Notebook

  - name: NB_RUN_REMOTE_PIPELINE
    type: Notebook
    path: NB_RUN_REMOTE_PIPELINE.Notebook
    workspace: Code

  - name: NB_LOAD_BRONZE
    type: Notebook
    path: NB_LOAD_BRONZE.Notebook

  - name: NB_LOAD_SILVER
    type: Notebook
    path: NB_LOAD_SILVER.Notebook
    requires_silver: true

  - name: sil_customer
    type: Notebook
    path: sil_customer.Notebook
    requires_silver: true

  - name: NB_LOAD_GOLD
    type: Notebook
    path: NB_LOAD_GOLD.Notebook

  - name: dim_customer
    type: Notebook
    path: dim_customer.Notebook

  - name: fact_signup
    type: Notebook
    path: fact_signup.Notebook

  - name: PL_INGEST_SQL
    type: DataPipeline
    path: PL_INGEST_SQL.DataPipeline
    workspace: Ingestion

  - name: PL_INGEST_FILE
    type: DataPipeline
    path: PL_INGEST_FILE.DataPipeline
    workspace: Ingestion

  - name: PL_INGEST_SQLMI
    type: DataPipeline
    path: PL_INGEST_SQLMI.DataPipeline
    workspace: Ingestion

  - name: PL_INGEST_ORACLE
    type: DataPipeline
    path: PL_INGEST_ORACLE.DataPipeline
    workspace: Ingestion

  - name: PL_INGEST_SFTP
    type: DataPipeline
    path: PL_INGEST_SFTP.DataPipeline
    workspace: Ingestion

  - name: PL_INGEST_FTP
    type: DataPipeline
    path: PL_INGEST_FTP.DataPipeline
    workspace: Ingestion

  - name: PL_INGEST_ONELAKETABLE
    type: DataPipeline
    path: PL_INGEST_ONELAKETABLE.DataPipeline
    workspace: Ingestion

  - name: PL_INGEST_ONELAKEFILE
    type: DataPipeline
    path: PL_INGEST_ONELAKEFILE.DataPipeline
    workspace: Ingestion

  - name: PL_LOAD_BRONZE
    type: DataPipeline
    path: PL_LOAD_BRONZE.DataPipeline

  - name: PL_LOAD_SILVER
    type: DataPipeline
    path: PL_LOAD_SILVER.DataPipeline
    requires_silver: true

  - name: PL_LOAD_GOLD
    type: DataPipeline
    path: PL_LOAD_GOLD.DataPipeline

  - name: PL_RUN_ALL
    type: DataPipeline
    path: PL_RUN_ALL.DataPipeline
