# One entry per environment NB_DEPLOY.ipynb can target. `short` is used in workspace
# display names: "Keystone Data (D)", "Keystone Data (T)", "Keystone Data (P)".
#
# include_silver: only the environments that actually need shared Gold logic should
# set this true -- it's what makes the Silver lakehouse (and its pipeline/notebook)
# conditional rather than a permanent fixture. Leave false until a real Bronze entity
# needs to be reused by 2+ Gold objects -- for a fresh clone of this repo, that means
# false, not the true set below.
#
# Set to true here (deliberately, not left over from testing) to keep the Silver
# path live end-to-end as a working, verified example: silver.customer is a demo
# 1:1 reshape of the Bronze customer entity (see NB_DEPLOY's seed step), proven in
# all three environments -- Gold still reads Bronze directly, since nothing in this
# demo actually needs Silver's reuse. Flip back to false (and drop the Silver
# lakehouse/NB_LOAD_SILVER/PL_LOAD_SILVER from a target environment by hand) once
# this framework has a real multi-Gold-consumer use case, or none at all.

# metadata_connection_guid: the GUID of the Fabric Connection the ingestion pipelines'
# native Lookup activities use to query the metadata catalog (ingestion.vw_ActiveIngestTables)
# directly -- no notebook in the loop. This one Connection is a chicken-and-egg case (you
# can't look up how to reach the metadata database FROM the metadata database), so unlike
# every other source Connection -- which lives entirely in ingestion.Connection, referenced
# only by GUID from there -- this one has to live here in git config. One-time manual step
# per environment: register a Connection to SQL_METADATA_DATABASE in the Ingestion workspace
# (service-principal credentials, not Workspace Identity -- see DEPLOYMENT.md), then paste
# its GUID below. Leave "" until you've done that; PL_INGEST_SQL/PL_INGEST_FILE won't deploy
# a working Lookup without it.
environments:
  - name: development
    short: D
    capacity: fabfabricmsa
    include_silver: true
    metadata_connection_guid: ""
  - name: test
    short: T
    capacity: fabfabricmsa
    include_silver: true
    metadata_connection_guid: ""
  - name: production
    short: P
    capacity: fabfabricmsa
    include_silver: true
    metadata_connection_guid: ""

# Entra principals granted access to each workspace TIER (data / ingestion / code).
# Split per tier, not one flat list applied everywhere -- Ingestion holds source
# Connections and the raw metadata catalog, so it deliberately doesn't have to grant
# whatever a report-building principal needs in Code. Leave a tier's list empty to
# grant access only to the identity running the deployment for that tier (matches
# upstream's own "keep empty [] if you only want to assign this to your personal
# account" pattern).
workspace_roles:
  data: []
  ingestion: []
  code: []
# Example: a group that browses Gold-facing items in Code, but has no access to
# Ingestion's source Connections or the metadata catalog at all:
# workspace_roles:
#   data: []
#   ingestion: []
#   code:
#     - principal_id: "00000000-0000-0000-0000-000000000000"
#       principal_type: Group   # Group | User | ServicePrincipal
#       role: Viewer            # Admin | Member | Contributor | Viewer
